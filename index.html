<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>For Pranjuuu 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blush:#fff0f3;--rose:#f7b6c8;--pink:#e8799b;--wine:#7a1634;--burgundy:#4a0d20;--cream:#fff8f6;
--serif:'Playfair Display',Georgia,serif;--hand:'Caveat','Segoe Script',cursive}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Georgia,serif;color:var(--burgundy);background:var(--blush);line-height:1.7;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
section{min-height:100vh;padding:64px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
h1,h2{font-family:var(--serif);font-weight:600;color:var(--wine);line-height:1.15}
h1{font-size:clamp(2.6rem,11vw,5.5rem)}
h2{font-size:clamp(1.8rem,7vw,3rem);margin-bottom:24px}
.hand{font-family:var(--hand);font-size:1.6rem;color:var(--pink)}
#hero{background:radial-gradient(circle at 50% 0,#ffd3df,var(--blush) 65%)}
.count{display:flex;gap:10px;margin:32px 0;flex-wrap:wrap;justify-content:center}
.count div{background:var(--burgundy);color:var(--rose);border-radius:18px;width:76px;padding:12px 0}
.count b{display:block;font:600 2rem var(--serif);color:#fff}
.count span{font-size:.75rem}
.btn{font:600 1.05rem var(--serif);background:var(--wine);color:#fff;border:0;border-radius:40px;padding:14px 32px;cursor:pointer;box-shadow:0 6px 0 var(--burgundy);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--burgundy)}
.btn:focus-visible,audio:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.link{background:none;border:0;color:var(--wine);font:1rem var(--serif);text-decoration:underline;cursor:pointer;margin-top:22px}
#codeForm{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#codeForm input{font:1.4rem var(--serif);letter-spacing:.4em;text-align:center;width:150px;border:2px solid var(--rose);border-radius:40px;padding:8px 12px;color:var(--burgundy);background:#fff}
#codeForm input:focus-visible{outline:3px solid var(--pink)}
#codeErr{width:100%;min-height:1.5rem;color:var(--wine);font-size:.95rem}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#cakeSec{background:var(--burgundy);color:var(--rose)}
#cakeSec h2{color:var(--rose)}
.cake{position:relative;width:240px;height:230px;margin:40px auto 30px}
.layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.l1{bottom:0;width:240px;height:80px;background:var(--pink)}
.l2{bottom:80px;width:180px;height:70px;background:var(--rose)}
.l3{bottom:150px;width:120px;height:56px;background:#fff}
.layer::before{content:"";position:absolute;inset:0 0 auto;height:22px;background:var(--wine);border-radius:14px 14px 40% 40%;opacity:.85}
.candles{position:absolute;bottom:206px;left:50%;transform:translateX(-50%);display:flex;gap:18px}
.candle{width:10px;height:38px;background:repeating-linear-gradient(45deg,#fff 0 6px,var(--pink) 6px 12px);border-radius:3px;position:relative}
.flame{position:absolute;top:-24px;left:-3px;width:16px;height:24px;background:radial-gradient(#fff6b0,#ffb347 60%,transparent 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .25s infinite alternate;transform-origin:bottom}
.out .flame{display:none}
@keyframes flick{to{transform:scale(1.15,.9) rotate(-5deg)}}
#wish{font:2.2rem var(--hand);min-height:3rem;color:#fff}
#letter{background:var(--cream)}
.paper{max-width:560px;background:#fff;border:2px solid var(--rose);border-radius:6px 28px 6px 28px;padding:36px 28px;text-align:left;box-shadow:12px 12px 0 var(--rose)}
.paper p{margin-bottom:16px;font-size:1.05rem}
.paper .sign{font:2rem var(--hand);color:var(--wine);margin:24px 0 0;text-align:right}
#gallery{background:linear-gradient(var(--cream),var(--blush))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;max-width:760px;width:100%}
.photo{background:#fff;padding:10px 10px 14px;box-shadow:0 8px 20px rgba(74,13,32,.18);transform:rotate(var(--r))}
.photo:nth-child(odd){--r:-2.5deg}.photo:nth-child(even){--r:2deg}
.photo .ph{aspect-ratio:1;background:var(--rose);display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo p{font:1.35rem var(--hand);color:var(--wine);margin-top:8px;line-height:1.2}
#music{background:var(--wine);color:var(--rose)}
#music h2{color:#fff}
audio{width:min(100%,360px);margin-top:20px}
footer{background:var(--burgundy);color:var(--rose);text-align:center;padding:28px 16px;font:1.4rem var(--hand)}
.heart{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg)}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){.flame{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<section id="hero">
  <p class="hand" id="heroTop">something special is coming…</p>
  <h1>Pranjuuu<br>turns 19</h1>
  <div class="count" id="count" aria-live="off"></div>
  <p id="countMsg"></p><br>
  <button class="btn" id="openBtn">Open your surprise 🎁</button>
  <div id="codeBox">
    <button class="link" id="codeToggle">I have a secret code 🔑</button>
    <div id="codeForm" class="hidden">
      <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••" autocomplete="off" aria-label="Secret code">
      <button class="btn" id="codeGo" style="padding:10px 24px;font-size:1rem">Unlock</button>
      <p id="codeErr" role="status"></p>
    </div>
  </div>
</section>

<section id="cakeSec" class="hidden">
  <p class="hand" style="color:var(--rose)">make a wish, Pranjuuu…</p>
  <h2>Happy 19th Birthday!</h2>
  <div class="cake" id="cake">
    <div class="candles"><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div><div class="candle"><i class="flame"></i></div></div>
    <div class="layer l3"></div><div class="layer l2"></div><div class="layer l1"></div>
  </div>
  <p id="wish"></p>
  <button class="btn" id="blowBtn">Blow out the candles 🕯️</button>
  <p style="margin-top:30px"><a href="#letter" style="color:var(--rose)">scroll down, there's more ↓</a></p>
</section>

<section id="letter" class="hidden">
  <h2>A letter, just for you</h2>
  <div class="paper" id="paper"></div>
</section>

<section id="gallery" class="hidden">
  <h2>Our little memories</h2>
  <div class="grid" id="grid"></div>
</section>

<section id="music" class="hidden">
  <h2>Your song 🎶</h2>
  <p>It starts playing on its own. Tap play if your phone blocks it.</p>
  <audio id="song" controls loop preload="none" src="music/song.mp3"></audio>
  <p id="songErr" class="hidden" style="margin-top:14px">Add your song as <b>music/song.mp3</b> to hear it here.</p>
</section>

<footer class="hidden" id="foot"></footer>
<canvas id="cf"></canvas>

<script>
/* ============ PERSONALIZE EVERYTHING HERE ============ */
const CONFIG = {
  herName: "Pranjuuu",
  fromName: "Your Bestie",          // <- your name, shown at the end of the letter
  birthYear: 2007,                   // <- year she was born
  birthdayMonth: 11,                 // <- her birthday month (1-12)
  birthdayDay: 29,                   // <- her birthday day
  turning: 19,
  lockUntilBirthday: true,           // true = locked until her birthday (or until the secret code is entered)
  wish: "May every wish you make this year come true 💗",
  letter: [
    "Dear Pranjuuu,",
    "Nineteen! I still remember when we were just two people who happened to sit next to each other. Somehow that turned into my favourite person in the whole world.",
    "Thank you for every late-night talk, every silly inside joke, every time you made a bad day feel okay. You show up for people without making a big deal of it, and that is rare.",
    "This year I wish you big dreams, softer mornings, and people who love you the way you love them. Whatever comes next, I'm in your corner, always.",
    "Happy birthday, my dear. I love you more than this cake can hold."
  ],
  photos: [
    {src: "photos/1.jpg", caption: "Sunny day, big smiles"},
    {src: "photos/2.jpg", caption: "3 Dec 2025, my favourite memory"},
    {src: "photos/3.jpg", caption: "Always cheek to cheek"}
  ],
  footer: "Made with love, just for Pranjuuu 💗"
};
/* ======================================================= */

const $ = id => document.getElementById(id);
const target = new Date(CONFIG.birthYear + CONFIG.turning, CONFIG.birthdayMonth-1, CONFIG.birthdayDay);
let codeOK = false;
const hh=(str,seed=7)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<str.length;i++){c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const CODE_HASH = "25beqee837p"; // hash of the secret code, not the code itself
function tick(){
  const now = new Date();
  const open = now >= target || !CONFIG.lockUntilBirthday || codeOK;
  if (now >= target){
    $("count").innerHTML = "";
    $("countMsg").textContent = "It's here! Happy birthday, " + CONFIG.herName + " 🎉";
    $("heroTop").textContent = "the day is finally here";
  } else {
    let s = Math.max(0, Math.floor((target - now)/1000));
    const v = [["days",86400],["hours",3600],["mins",60],["secs",1]].map(([l,k])=>{const x=Math.floor(s/k);s%=k;return [l,x]});
    $("count").innerHTML = v.map(([l,x])=>`<div><b>${String(x).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
    $("countMsg").textContent = open ? "unlocked early, just for you 💗" : "until the big one-nine 💗";
  }
  $("codeBox").classList.toggle("hidden", open);
  $("openBtn").disabled = !open;
  $("openBtn").textContent = open ? "Open your surprise 🎁" : "Unlocks on your birthday 🔒";
}
tick(); setInterval(tick, 1000);

/* letter */
$("paper").innerHTML = CONFIG.letter.map(p=>`<p>${p}</p>`).join("") + `<p class="sign">${CONFIG.fromName} 💌</p>`;
/* photos */
$("grid").innerHTML = CONFIG.photos.map(p=>`<figure class="photo"><div class="ph">💗<img src="${p.src}" alt="${p.caption}" loading="lazy" onerror="this.remove()"></div><p>${p.caption}</p></figure>`).join("");
$("foot").textContent = CONFIG.footer;
$("song").addEventListener("error", ()=>$("songErr").classList.remove("hidden"), true);

/* floating hearts */
function heart(){
  const h = document.createElement("div"); h.className="heart"; h.textContent=["💗","💖","🌸","💕"][Math.random()*4|0];
  h.style.left = Math.random()*100+"vw"; h.style.fontSize = 14+Math.random()*18+"px"; h.style.animationDuration = 5+Math.random()*5+"s";
  document.body.appendChild(h); setTimeout(()=>h.remove(),10500);
}
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
if(!reduce) setInterval(heart, 900);

/* confetti */
const cv = $("cf"), cx = cv.getContext("2d"); let bits = [];
function size(){cv.width=innerWidth;cv.height=innerHeight} size(); addEventListener("resize",size);
function burst(){
  const cols=["#e8799b","#f7b6c8","#7a1634","#fff","#ffd3df"];
  for(let i=0;i<160;i++) bits.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,r:4+Math.random()*5,c:cols[i%5],a:1});
  if(!bits.running){bits.running=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.28;b.a-=.006;cx.globalAlpha=Math.max(b.a,0);cx.fillStyle=b.c;cx.fillRect(b.x,b.y,b.r,b.r*1.6)});
  bits = Object.assign(bits.filter(b=>b.a>0&&b.y<innerHeight+20),{running:true});
  if(bits.length) requestAnimationFrame(loop); else {bits.running=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* secret code */
$("codeToggle").onclick = ()=>{ $("codeForm").classList.toggle("hidden"); $("code").focus(); };
function tryCode(){
  const v = $("code").value.trim();
  if (hh("pranjuuu-"+v+"-surprise") === CODE_HASH){ codeOK = true; $("codeErr").textContent=""; tick(); }
  else { $("codeErr").textContent = "That code isn't right. Try again."; $("code").value=""; $("code").classList.remove("shake"); void $("code").offsetWidth; $("code").classList.add("shake"); }
}
$("codeGo").onclick = tryCode;
$("code").addEventListener("keydown", e=>{ if(e.key==="Enter") tryCode(); });

/* flow */
$("openBtn").onclick = ()=>{
  ["cakeSec","letter","gallery","music","foot"].forEach(i=>$(i).classList.remove("hidden"));
  burst(); try{$("song").play()}catch(e){} $("cakeSec").scrollIntoView({behavior:reduce?"auto":"smooth"});
};
$("blowBtn").onclick = ()=>{
  $("cake").classList.add("out"); $("blowBtn").disabled = true; $("blowBtn").textContent = "Wish made 💫";
  $("wish").textContent = CONFIG.wish; burst();
};
</script>
</body>
</html>
